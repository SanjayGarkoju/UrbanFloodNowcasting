<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chennai Sewer Network — CMWSSB Real • 5×5m</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class', theme:{extend:{fontFamily:{sans:['Geist','system-ui','sans-serif'], mono:['JetBrains Mono','monospace']}}}}</script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="static/css/map.css" rel="stylesheet">
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased overflow-hidden">
<div id="map"></div>
<header class="fixed top-0 left-0 right-0 h-[64px] z-50 bg-zinc-950/90 backdrop-blur-xl border-b border-white/[0.08] flex items-center px-5 gap-4">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg bg-white text-zinc-950 grid place-items-center"><i class="ph ph-waves text-[18px]"></i></div>
    <div>
      <div class="text-[13px] font-semibold tracking-tight leading-none">CHENNAI NETWORK</div>
      <div class="text-[10px] tracking-[0.14em] text-zinc-500 font-mono">5×5M • CMWSSB REAL • 253 MAINS</div>
    </div>
  </div>
  <div class="h-6 w-px bg-white/10 mx-2"></div>
  <div class="text-[11px] font-mono text-zinc-400">80.225–80.255 / 13.04–13.08 • T. NAGAR PILOT</div>
  <div class="ml-auto flex items-center gap-2">
    <button id="darkToggle" onclick="toggleTheme()" class="h-8 px-3 rounded-full bg-sky-500 text-white text-[11px] font-mono font-semibold flex items-center gap-1.5"><i class="ph ph-moon"></i> DARK</button>
    <span class="text-[11px] font-mono px-2.5 py-1 rounded-full bg-white/5 text-zinc-400 border border-white/10">800 manholes • 300 inlets</span>
    <span id="clock" class="text-[11px] font-mono text-zinc-500"></span>
  </div>
</header>
<!-- Legend only -->
<div class="fixed bottom-3 right-3 z-40 bg-zinc-900/90 backdrop-blur-xl border border-white/10 rounded-2xl p-3">
  <div class="text-[10px] tracking-[0.16em] font-semibold text-zinc-400 mb-2">LEGEND</div>
  <div class="space-y-1.5 text-[11px] font-mono">
    <div class="flex items-center gap-2"><span class="w-3 h-0.5 bg-emerald-400"></span> Pipe ≥400mm (253)</div>
    <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-sky-400"></span> Manhole 800</div>
    <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-400"></span> Inlet 300</div>
  </div>
</div>
<script src="static/js/chennai-data.js"></script>
<script src="static/js/map.js"></script>
</body>
</html>
