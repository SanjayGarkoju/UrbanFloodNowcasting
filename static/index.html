<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chennai — CMWSSB Real</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class', theme:{extend:{fontFamily:{sans:['Geist','system-ui','sans-serif'], mono:['JetBrains Mono','monospace']}}}}</script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="static/css/map.css" rel="stylesheet">
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased overflow-hidden">
<div id="map"></div>
<header class="fixed top-0 left-0 right-0 h-[56px] z-50 bg-zinc-950/80 backdrop-blur-xl border-b border-white/[0.06] flex items-center px-4">
  <div class="flex items-center gap-2">
    <div class="w-7 h-7 rounded-lg bg-white text-zinc-950 grid place-items-center"><i class="ph ph-waves text-[16px]"></i></div>
    <div class="text-[12px] font-semibold tracking-tight">CHENNAI</div>
  </div>
  <div class="ml-auto flex items-center gap-2">
    <button id="layerToggle" onclick="toggleLayer()" class="h-7 px-3 rounded-full bg-zinc-800 text-zinc-300 border border-white/10 text-[11px] font-mono font-semibold">LAYER 1</button>
    <a id="undergroundToggle" href="/static/underground.html" class="h-7 px-3 rounded-full bg-cyan-500 text-white text-[11px] font-mono font-semibold grid place-items-center">UNDERGROUND ↓</a>
    <button id="darkToggle" onclick="toggleTheme()" class="h-7 px-3 rounded-full bg-sky-500 text-white text-[11px] font-mono font-semibold flex items-center gap-1.5"><i class="ph ph-sun"></i></button>
    <span id="clock" class="text-[11px] font-mono text-zinc-500 min-w-[64px] text-right"></span>
  </div>
</header>
<button id="legendBtn" class="fixed bottom-3 right-3 z-40 w-8 h-8 rounded-full bg-zinc-900/90 border border-white/10 grid place-items-center text-zinc-400 hover:text-white" onmouseenter="document.getElementById('legend').classList.remove('hidden')" onmouseleave="document.getElementById('legend').classList.add('hidden')"><i class="ph ph-info"></i></button>
<div id="legend" class="hidden fixed bottom-12 right-3 z-40 bg-zinc-900/90 backdrop-blur-xl border border-white/10 rounded-xl p-3 text-[11px] font-mono leading-relaxed">
  <div class="text-[10px] tracking-[0.12em] text-zinc-500 mb-1">PIPES — solid known / dashed inferred</div>
  <div class="flex items-center gap-2"><span class="w-6 h-[4px] bg-[#0369a1]"></span> Outfall 4px</div>
  <div class="flex items-center gap-2"><span class="w-6 h-[2.8px] bg-[#0284c7]"></span> Trunk 2.8px</div>
  <div class="flex items-center gap-2"><span class="w-6 h-[1.8px] bg-[#0ea5e9]"></span> Secondary 1.8px</div>
  <div class="flex items-center gap-2"><span class="w-6 h-[1px] bg-[#60a5fa]"></span> Local 1px</div>
  <div class="flex items-center gap-2"><span class="w-6 h-[1px] bg-[#93c5fd] border-t border-dashed border-[#93c5fd]"></span> Lateral 0.6px dashed</div>
  <div class="mt-2 pt-2 border-t border-white/10 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-sky-400"></span> Manhole 502</div>
  <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-400"></span> Inlet 192</div>
  <div class="text-[10px] text-zinc-500 mt-1">opacity = connection_confidence</div>
</div>
<script src="static/js/chennai-data.js"></script>
<script src="static/js/map.js"></script>
</body>
</html>
