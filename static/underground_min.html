<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Min Test</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>html,body{margin:0;height:100%}#cesiumContainer{width:100%;height:100%}</style>
</head>
<body>
<div id="cesiumContainer"></div>
<script>
Cesium.Ion.defaultAccessToken=undefined;
const viewer=new Cesium.Viewer('cesiumContainer',{terrainProvider:new Cesium.EllipsoidTerrainProvider(), baseLayer:new Cesium.ImageryLayer(new Cesium.UrlTemplateImageryProvider({url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'})), baseLayerPicker:false, geocoder:false, homeButton:false, sceneModePicker:false, navigationHelpButton:false, animation:false, timeline:false, fullscreenButton:false, vrButton:false, selectionIndicator:false, infoBox:false, shouldAnimate:true});
viewer.scene.screenSpaceCameraController.enableCollisionDetection=false;
viewer.scene.globe.translucency.enabled=true;
viewer.scene.globe.translucency.frontFaceAlpha=0.12;
console.log('Viewer created');
// test one pipe at -10m
viewer.entities.add({polyline:{positions:[Cesium.Cartesian3.fromDegrees(80.24,13.06,-10), Cesium.Cartesian3.fromDegrees(80.245,13.065,-10)], width:5, material:Cesium.Color.RED}});
console.log('Added test pipe');
viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(80.24,13.06,600), orientation:{heading:0,pitch:Cesium.Math.toRadians(-60),roll:0}, duration:1});
</script>
</body>
</html>
